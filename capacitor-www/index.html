<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eloq</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: #a1a1aa; margin: 0 0 24px; }
      button { background: #6366f1; color: white; border: 0; border-radius: 999px;
        padding: 12px 24px; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- Only shown if eloq-oral.com can't be reached (the app loads the
         live site; see capacitor.config.ts). -->
    <main>
      <h1>Sin conexión</h1>
      <p>Eloq necesita internet para analizar cómo hablas.</p>
      <button onclick="location.href='https://eloq-oral.com'">Reintentar</button>
    </main>
  </body>
</html>
