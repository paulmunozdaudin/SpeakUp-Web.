<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eloq AI</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #09090b;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  .badge {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: #161042;
    display: flex; align-items: center; justify-content: center;
  }
  .badge span {
    font-family: Georgia, serif;
    font-weight: 800;
    font-size: 30px;
    background: linear-gradient(135deg, #8b7cf6 0%, #4f46e5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { font-size: 20px; font-weight: 600; }
  p { color: #a1a1aa; font-size: 14px; max-width: 320px; line-height: 1.5; }
  button {
    margin-top: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: #6d5ef8;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span>e.</span></div>
    <h1 id="title">You're offline</h1>
    <p id="body">Check your connection and try again — Eloq needs internet to analyze your practice.</p>
    <button onclick="location.reload()" id="retry">Retry</button>
  </div>
  <script>
    var lang = (navigator.language || "en").slice(0, 2);
    var copy = {
      es: ["Sin conexión", "Comprueba tu conexión e inténtalo de nuevo — Eloq necesita internet para analizar tu práctica.", "Reintentar"],
      fr: ["Hors ligne", "Vérifie ta connexion et réessaie — Eloq a besoin d'internet pour analyser ta prestation.", "Réessayer"],
      en: ["You're offline", "Check your connection and try again — Eloq needs internet to analyze your practice.", "Retry"],
    };
    var c = copy[lang] || copy.en;
    document.getElementById("title").textContent = c[0];
    document.getElementById("body").textContent = c[1];
    document.getElementById("retry").textContent = c[2];
  </script>
</body>
</html>
